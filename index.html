<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dias Satria · Galeri Aplikasi</title>
<meta name="description" content="Kumpulan aplikasi dan prototipe web oleh Dias Satria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F5F6F1;--surface:#FFFFFF;--text:#10261E;--muted:#4A5A52;--line:#D5DBD3;
  --accent:#1F4D36;--tag-bg:#E3EDE4;--tag-text:#1F4D36;--eyebrow:#8A4F0A;--shadow:0 1px 2px rgba(16,38,30,.06),0 8px 24px rgba(16,38,30,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A15;--surface:#15241D;--text:#E8EEE9;--muted:#A9B8AF;--line:#2A3D33;
    --accent:#8FD1A6;--tag-bg:#1F3529;--tag-text:#BFE3CB;--eyebrow:#F0C27A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A15;--surface:#15241D;--text:#E8EEE9;--muted:#A9B8AF;--line:#2A3D33;
  --accent:#8FD1A6;--tag-bg:#1F3529;--tag-text:#BFE3CB;--eyebrow:#F0C27A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{padding:72px 0 40px}
.eyebrow{font:500 13px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--eyebrow);text-transform:uppercase}
h1{margin:12px 0 12px;font:800 clamp(36px,5vw,56px)/1.04 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
header p{margin:0;max-width:36em;color:var(--muted);font-size:18px}
.cv-link{display:inline-flex;align-items:center;margin-top:20px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);font-weight:600;text-decoration:none}
.cv-link:hover{background:var(--tag-bg)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.filter{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.filter[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px;padding-bottom:80px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible,.cv-link:focus-visible{outline:3px solid #D9902B;outline-offset:3px}
.thumb{aspect-ratio:16/10;background:var(--tag-bg);border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h2{margin:0;font:700 22px/1.15 'Bricolage Grotesque',sans-serif}
.card p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12px;font-weight:600;background:var(--tag-bg);color:var(--tag-text);padding:3px 10px;border-radius:999px}
.open{font-weight:600;font-size:14px;color:var(--accent)}
.empty{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Galeri Aplikasi</span>
    <h1>Dias Satria</h1>
    <p>Kumpulan aplikasi web, toolkit, dan prototipe yang bisa langsung dicoba di browser.</p>
    <a class="cv-link" href="cv/">Lihat CV →</a>
  </header>

  <div class="toolbar" id="filters" role="group" aria-label="Filter kategori"></div>
  <main class="grid" id="gallery"></main>
</div>
<footer><div class="wrap">© <span id="year"></span> Dias Satria</div></footer>

<script>
var APPS = [
  {
    title: 'Toolkit Digital AgTech Indonesia',
    desc: 'Toolkit lima chapter untuk startup AgTech: Diagnostic Radar, Mom Test, Root Cause Analysis, Value Proposition Canvas, MVP, dan Milestone Gate berbasis bukti.',
    href: 'agtech/',
    thumb: 'assets/thumbs/agtech.jpg',
    tags: ['AgTech', 'Startup', 'Toolkit']
  },
  {
    title: 'Digital Agtech Indonesia — Event Website',
    desc: 'Website event AgTech: webinar "From Idea to Scale: Startup Pertanian", jadwal acara, pembicara, event mendatang per kategori, galeri, partner, dan berita.',
    href: 'event/',
    thumb: 'assets/thumbs/event.jpg',
    tags: ['AgTech', 'Event', 'Website']
  }
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

var active = 'Semua';
var cats = ['Semua'].concat(APPS.reduce(function (all, a) {
  a.tags.forEach(function (t) { if (all.indexOf(t) < 0) all.push(t); });
  return all;
}, []));

function render() {
  document.getElementById('filters').innerHTML = cats.length > 2 ? cats.map(function (c) {
    return '<button type="button" class="filter" data-cat="' + esc(c) + '" aria-pressed="' + (c === active) + '">' + esc(c) + '</button>';
  }).join('') : '';
  var list = APPS.filter(function (a) { return active === 'Semua' || a.tags.indexOf(active) >= 0; });
  document.getElementById('gallery').innerHTML = list.length ? list.map(function (a) {
    return '<a class="card" href="' + esc(a.href) + '">' +
      '<div class="thumb">' + (a.thumb ? '<img src="' + esc(a.thumb) + '" alt="" loading="lazy">' : '') + '</div>' +
      '<div class="body"><h2>' + esc(a.title) + '</h2><p>' + esc(a.desc) + '</p>' +
      '<div class="tags">' + a.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<span class="open">Buka aplikasi →</span></div></a>';
  }).join('') : '<p class="empty">Belum ada aplikasi di kategori ini.</p>';
}

document.getElementById('filters').addEventListener('click', function (e) {
  var b = e.target.closest('[data-cat]');
  if (!b) return;
  active = b.dataset.cat;
  render();
});
document.getElementById('year').textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
